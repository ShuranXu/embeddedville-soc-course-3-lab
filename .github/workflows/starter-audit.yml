name: Starter audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Lint the incomplete starter and open testbench
        run: docker run --rm --network none --security-opt no-new-privileges --cap-drop ALL -v "$PWD:/work:ro" -w /work ghcr.io/shuranxu/embeddedville-soc-course-2-lab-devcontainer@sha256:632bdb4fa495760de0c1ff50786b0dafe6eb2b0f1089d7cee45e5c96080f27ab bash -lc 'verilator --lint-only --timing -Wall -Wno-fatal rtl/course3_soc.sv sim/tb_course3.sv'
      - name: Reject protected or sibling-course material
        shell: bash
        run: |
          set -euo pipefail
          ! find . -path ./.git -prune -o -type f -print | grep -E '/(solution|protected|staff|course-2|course-4)' 
